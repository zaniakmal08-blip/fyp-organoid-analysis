name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy Pillow opencv-python-headless pytest ruff
      - name: Structure, links, manifest and checkpoint hash
        run: python scripts/check_repository.py
      - name: Code style
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (no lab data or Fiji needed)
        run: python -m pytest -q
