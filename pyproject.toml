# Tool configuration only. The project is run as scripts from the repository
# root (see docs/SETUP.md); it is not an installable package.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long explanatory strings are allowed; the formatter handles code

[tool.ruff.lint.per-file-ignores]
# These scripts add src/ to sys.path before importing project modules.
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
